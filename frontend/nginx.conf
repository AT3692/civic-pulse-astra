worker_processes auto;
pid /tmp/nginx.pid;                      # writable by non-root
error_log /dev/stderr warn;              # logs to stdout/stderr, never files

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Non-root nginx cannot write to /var/cache/nginx, so use /tmp
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log /dev/stdout;
    server_tokens off;
    sendfile on;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Reuse the caller's X-Request-ID if present, otherwise generate one
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    server {
        listen 8080;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Container healthcheck / probe target: no backend dependency
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # API reverse proxy: the browser only ever talks to its own origin,
        # so the built image contains no environment-specific URL.
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $req_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;   # LLM call (10s) + one retry + headroom
        }

        # Vite emits content-hashed filenames, so these are safe to cache forever
        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Never cache the SPA shell, otherwise users get stale bundles after deploys
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # SPA fallback: unknown paths go to React Router
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
