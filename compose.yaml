name: civicpulse

networks:
  edge:                      # frontend <-> backend (has outbound internet via the bridge)
    driver: bridge
  internal:                  # backend <-> postgres <-> redis (no route out)
    driver: bridge
    internal: true

volumes:
  pgdata:                    # PostgreSQL data directory, the durable one
  redisdata:                 # Redis AOF file
  ollama_models:             # model weights, avoids re-pulling ~800 MB on every up

services:
  frontend:
    build:
      context: ./frontend
    image: civicpulse-frontend:dev
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    networks: [edge]                       # edge only: no route to postgres/redis
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 128M }

  backend:
    build:
      context: ./backend
    image: civicpulse-backend:dev
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers --log-config logging.json --reload
    environment:
      APP_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      TRIAGE_PROVIDER: ${TRIAGE_PROVIDER:-simulated}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-llama-3.1-8b-instant}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12,10.0.0.0/8}
      OPERATOR_API_KEY: ${OPERATOR_API_KEY:-}
      SIMULATED_FAILURE_RATE: ${SIMULATED_FAILURE_RATE:-0}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
    ports:
      - "127.0.0.1:8000:8000"              # dev only: Swagger UI at /docs
    networks: [edge, internal]             # the only service bridging both
    volumes:
      - ./backend/app:/app/app:ro          # dev only: hot reload
      - ./backend/alembic:/app/alembic:ro  # dev only: iterate on migrations
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 512M }

  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 512M }

  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }

  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-0.5.7}
    volumes:
      - ollama_models:/root/.ollama
    networks: [edge]                       # needs outbound access to pull models
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "2.00", memory: 3G }
