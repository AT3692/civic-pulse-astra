[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 120
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
[tool.coverage.run]
source = ["app"]
omit = ["app/seed.py"]
[tool.coverage.report]
fail_under = 65
show_missing = true
