name: CI
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev, 'feat/**', 'fix/**']
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint-and-type:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend scripts && ruff format --check backend scripts
      - run: cd backend && mypy app
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run lint && npm --prefix frontend run typecheck && npm --prefix frontend run format:check
      - name: Check OpenAPI and generated client have not drifted
        run: |
          python scripts/export_openapi.py
          npm --prefix frontend run generate:api
          git diff --exit-code -- backend/openapi.json frontend/src/api/schema.d.ts
      - run: python scripts/check_submission.py
  test-backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env: {POSTGRES_USER: test, POSTGRES_PASSWORD: ci-ephemeral-only, POSTGRES_DB: civicpulse_test}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U test -d civicpulse_test" --health-interval 5s --health-retries 10
      redis:
        image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      TRIAGE_PROVIDER: simulated
      TEST_DATABASE_URL: postgresql://test:ci-ephemeral-only@localhost:5432/civicpulse_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - run: pip install -r backend/requirements-dev.txt
      - run: cd backend && pytest --cov=app --cov-fail-under=65 --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@v4
        with: {name: backend-coverage, path: backend/coverage.xml}
  test-frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend test && npm --prefix frontend run build
  build-and-scan:
    needs: [lint-and-type, test-backend, test-frontend]
    runs-on: ubuntu-24.04
    strategy:
      matrix: {component: [backend, frontend]}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          load: true
          push: false
          tags: civicpulse-${{ matrix.component }}:ci
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: civicpulse-${{ matrix.component }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
  manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-kube-tools.sh
      - run: |
          kubectl kustomize k8s/overlays/dev | kubeconform -strict -summary
          kubectl kustomize k8s/overlays/prod | kubeconform -strict -summary
  integration:
    needs: [lint-and-type, test-backend, test-frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Start all five containers and seed
        run: bash scripts/quickstart.sh
      - name: Real request through Nginx
        run: python scripts/smoke.py
      - name: Verify network isolation and seed idempotence
        run: |
          docker compose exec -T frontend sh -c '! nc -z -w 2 postgres 5432'
          docker compose exec -T backend python -m app.seed | grep 'Inserted 0'
      - name: Capture logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Always clean up test volumes
        if: always()
        run: docker compose down -v
  required:
    if: always()
    needs: [lint-and-type, test-backend, test-frontend, build-and-scan, manifests, integration]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PYGATE'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          assert all(job['result'] == 'success' for job in jobs.values()), jobs
          PYGATE
