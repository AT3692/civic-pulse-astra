name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  test:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: test
    runs-on: ubuntu-24.04
    permissions: {contents: write, packages: write}
    steps:
      - uses: actions/checkout@v4
      - name: Validate semantic version
        env: {TAG: '${{ github.ref_name }}'}
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - id: names
        env: {OWNER: '${{ github.repository_owner }}'}
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with: {context: ./backend, push: true, tags: 'ghcr.io/${{ steps.names.outputs.owner }}/civicpulse-backend:${{ github.ref_name }}', sbom: true}
      - uses: docker/build-push-action@v6
        with: {context: ./frontend, push: true, tags: 'ghcr.io/${{ steps.names.outputs.owner }}/civicpulse-frontend:${{ github.ref_name }}', sbom: true}
      - name: Generate release notes
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}', TAG: '${{ github.ref_name }}'}
        run: gh release create "$TAG" --generate-notes --verify-tag
