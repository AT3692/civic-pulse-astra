apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 35
      containers:
      - name: backend
        image: civicpulse-backend:replace-me
        ports:
        - containerPort: 8000
          name: http
        envFrom: &id001
        - configMapRef:
            name: civicpulse-config
        - secretRef:
            name: civicpulse-secrets
        env: &id002
        - name: DATABASE_URL
          value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
        - name: REDIS_URL
          value: redis://:$(REDIS_PASSWORD)@redis:6379/0
        resources: &id003
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext: &id004
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts: &id005
        - name: tmp
          mountPath: /tmp
        command:
        - uvicorn
        - app.main:app
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        - --no-proxy-headers
        - --log-config
        - logging.json
        - --timeout-graceful-shutdown
        - '25'
        startupProbe:
          httpGet:
            path: /health
            port: http
          failureThreshold: 30
          periodSeconds: 2
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 8
        lifecycle:
          preStop:
            exec:
              command:
              - sh
              - -c
              - sleep 5
      initContainers:
      - image: civicpulse-backend:replace-me
        envFrom: *id001
        env: *id002
        resources: *id003
        securityContext: *id004
        volumeMounts: *id005
        name: wait-schema
        command:
        - python
        - -m
        - app.repositories.wait_schema
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
  - name: http
    port: 8000
    targetPort: 8000
